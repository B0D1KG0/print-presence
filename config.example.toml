# Settings for the console version (python -m print_presence).
# Copy this file to config.toml and fill it in. config.toml is git-ignored:
# it holds your printer's access code. The desktop app (PrintPresence.exe)
# doesn't need this file — it has its own settings window.

[discord]
# Optional: empty = the shared Print Presence app with ready-made icons.
# Your own: Developer Portal -> your app -> General Information -> Application ID
client_id = ""

# One [[printers]] block per printer. With several, Discord shows the busiest one.
[[printers]]
type = "bambu"
# Shown in Discord after "Playing". Empty = printer model, e.g. "Bambu Lab P1S".
name = ""
# Printer screen: Settings -> WLAN -> IP and Access Code
host = "192.168.1.50"
access_code = ""
# Bambu Studio -> Device, or the printer's settings
serial = ""

[presence]
language = "auto"        # "auto" (system language), "en", "ru" or "uk"
hide_job = false         # hide the file name in Discord
button = true            # "Get Print Presence" button in your status (only others see it)
show_when_idle = true    # show status while the printer is idle
update_interval = 15     # seconds; Discord doesn't allow less than 15
