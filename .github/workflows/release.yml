name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PrintPresence
          --icon assets/app.ico
          --add-data "assets/printer.png:assets"
          run_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: PrintPresence
          path: dist/PrintPresence.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintPresence.exe
          generate_release_notes: true
