name: Build Windows exe

# Started by hand from the Actions tab: builds the exe and publishes release
# v<__version__> if it doesn't exist yet. Locally use build.bat instead.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import print_presence; print(print_presence.__version__)")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PrintPresence
          --icon assets/app.ico
          --add-data "assets/printer.png:assets"
          run_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: PrintPresence
          path: dist/PrintPresence.exe

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/PrintPresence.exe
          generate_release_notes: true
