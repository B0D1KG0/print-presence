name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! English, Ukrainian or Russian are all fine.
        **Never post your Access Code.** Hide the serial number and IP in logs and screenshots.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown under "Print Presence" in the window
      placeholder: v0.7.2
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer model and firmware
      placeholder: Bambu Lab P1S, 01.10.00.00
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What is affected?
      options:
        - Connecting to the printer
        - Finding printers on the network
        - Discord status
        - The app window / tray
        - Installing / starting the app
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Steps to reproduce help a lot.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Copy the relevant lines from the Log tab (without your Access Code, serial and IP)
      render: text
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
